name: Repository Doctor

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'toolkit-contract.json'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'THREAT-MODEL.md'
      - 'docs/**'
      - '.github/REPOSITORY-GOVERNANCE.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'toolkit-contract.json'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'THREAT-MODEL.md'
      - 'docs/**'
      - '.github/REPOSITORY-GOVERNANCE.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: repository-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile doctor and regression test
        run: python -m py_compile scripts/doctor.py tests/test_doctor.py
      - name: Run repository doctor
        run: python scripts/doctor.py --mode ci --json
      - name: Run doctor regressions
        run: python -m unittest discover -s tests -p 'test_doctor.py' -v

  publish-main-status:
    needs: doctor
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout status publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish exact main Repository Doctor status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_status.py --context 'post-merge/Repository Doctor' --result '${{ needs.doctor.result }}'
