name: Transcribe Readback Bridge

on:
  workflow_run:
    workflows: ['Transcribe Public Source']
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  readback:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'runtime-requests'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish transcription artifact ID on queue commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          run_id = os.environ['RUN_ID']
          conclusion = os.environ['CONCLUSION']
          token = os.environ['GH_TOKEN']
          request_id = 'unknown'

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
          }

          def api_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def publish_status(state, description, target_url):
              url = f'https://api.github.com/repos/{repo}/statuses/{sha}'
              payload = json.dumps({
                  'state': state,
                  'context': 'transcriberen/readback',
                  'description': description[:140],
                  'target_url': target_url,
              }).encode()
              request = urllib.request.Request(
                  url,
                  data=payload,
                  method='POST',
                  headers={**headers, 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 201:
                      raise RuntimeError(f'unexpected commit-status response: {response.status}')

          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'
          try:
              if conclusion != 'success':
                  raise RuntimeError(f'transcription run={run_id} conclusion={conclusion}')

              artifacts = api_json(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
              ).get('artifacts') or []
              matches = [
                  item for item in artifacts
                  if str(item.get('name') or '').startswith('transcription-result-')
                  and not item.get('expired')
              ]
              if len(matches) != 1:
                  raise RuntimeError(
                      f'run={run_id} expected one live transcription-result artifact, got {len(matches)}'
                  )

              artifact = matches[0]
              artifact_name = str(artifact['name'])
              artifact_id = str(artifact['id'])
              request_id = artifact_name.removeprefix('transcription-result-') or 'unknown'
              artifact_url = (
                  f'https://github.com/{repo}/actions/runs/{run_id}/artifacts/{artifact_id}'
              )
              publish_status(
                  'success',
                  f'run={run_id} artifact={artifact_id} request={request_id}',
                  artifact_url,
              )
              print(json.dumps({
                  'request_id': request_id,
                  'head_sha': sha,
                  'run_id': run_id,
                  'artifact_id': artifact_id,
                  'artifact_name': artifact_name,
              }, indent=2))
          except Exception as exc:
              error_text = urllib.parse.quote(str(exc)[:120], safe='')
              publish_status(
                  'failure',
                  f'readback failed request={request_id}: {exc}',
                  f'{run_url}?readback_error={error_text}',
              )
              raise
          PY
