name: Dependency Lock Audit

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - '.github/workflows/lock-audit.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve and validate exact wheel set
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --no-input pip-tools
          pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file requirements.full.lock requirements.txt
          mkdir -p wheels
          python -m pip download --require-hashes --only-binary=:all: --dest wheels -r requirements.full.lock
          python - <<'PY'
          import hashlib
          import platform
          from pathlib import Path
          from packaging.utils import canonicalize_name, parse_wheel_filename

          rows = []
          for wheel in sorted(Path('wheels').glob('*.whl')):
              name, version, _build, _tags = parse_wheel_filename(wheel.name)
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              rows.append((canonicalize_name(name), str(version), digest, wheel.name))
          if not rows:
              raise SystemExit('no wheels resolved')
          if len({name for name, *_ in rows}) != len(rows):
              raise SystemExit('duplicate package in resolved wheel set')
          lines = [
              '# Fully pinned wheel lock for the production GitHub runtime.',
              '# Generated from requirements.txt on ubuntu-24.04 / Python 3.12 / x86_64.',
              f'# Generator Python: {platform.python_version()}',
              '# Regenerate through the audited lock workflow when requirements change.',
              '',
          ]
          for name, version, digest, wheel_name in sorted(rows):
              lines.append(f'{name}=={version} --hash=sha256:{digest}  # {wheel_name}')
          Path('requirements.lock').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m pip install --dry-run --no-index --find-links wheels --require-hashes --only-binary=:all: -r requirements.lock

      - name: Upload compact lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-lock-candidate
          path: requirements.lock
          retention-days: 1
          if-no-files-found: error
