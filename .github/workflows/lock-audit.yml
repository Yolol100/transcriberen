name: Dependency Lock Audit

on:
  push:
    branches: [agent/youtube-channel-captions-audit]
    paths:
      - '.github/workflows/lock-audit.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/youtube-channel-captions-audit
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate and validate fully hashed lock
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --no-input pip-tools
          pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file requirements.lock requirements.txt
          python -m pip install --dry-run --require-hashes --only-binary=:all: -r requirements.lock

      - name: Commit lock to audit branch
        run: |
          set -euo pipefail
          git add requirements.lock
          if git diff --cached --quiet; then
            echo 'requirements.lock unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock Python dependency tree with hashes'
          git push origin HEAD:agent/youtube-channel-captions-audit
