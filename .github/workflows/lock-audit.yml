name: Dependency Lock Audit

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/lock-audit.yml'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/lock-audit.yml'

permissions:
  contents: read

concurrency:
  group: dependency-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve, hash and compare exact wheel set
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          rm -rf wheels requirements.generated.lock
          mkdir -p wheels
          python -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --dest wheels \
            -r requirements.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path

          rows = []
          for wheel in sorted(Path('wheels').glob('*.whl')):
              stem = wheel.name[:-4]
              parts = stem.split('-')
              if len(parts) < 5 or not parts[0] or not parts[1]:
                  raise SystemExit(f'unexpected wheel filename: {wheel.name}')
              name = parts[0].replace('_', '-').lower()
              version = parts[1]
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              rows.append((name, version, digest, wheel.name))
          if not rows:
              raise SystemExit('no wheels resolved')
          if len({name for name, *_ in rows}) != len(rows):
              raise SystemExit('duplicate package in resolved wheel set')
          lines = [
              '# Fully pinned wheel lock for the production GitHub runtime.',
              '# Generated from requirements.txt on ubuntu-24.04 / Python 3.12 / x86_64.',
              '# Resolver: pip from the pinned setup-python runtime; wheel bytes are SHA-256 locked.',
              '# Regenerate through .github/workflows/lock-audit.yml when requirements change.',
              '',
          ]
          for name, version, digest, wheel_name in sorted(rows):
              lines.append(f'{name}=={version} --hash=sha256:{digest}  # {wheel_name}')
          Path('requirements.generated.lock').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m pip --isolated install \
            --dry-run \
            --no-index \
            --find-links wheels \
            --require-hashes \
            --only-binary=:all: \
            -r requirements.generated.lock
          diff -u requirements.lock requirements.generated.lock

      - name: Upload generated lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-lock-evidence-${{ github.run_id }}
          path: requirements.generated.lock
          retention-days: 7
          if-no-files-found: warn
