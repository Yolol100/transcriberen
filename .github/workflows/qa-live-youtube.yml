name: QA Live YouTube (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned yt-dlp and Deno only
        run: bash scripts/install_tools.sh false
      - name: Run live YouTube scenario matrix
        run: python tests/qa_live_youtube.py
