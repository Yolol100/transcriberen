name: Corpus Knowledge Review

# Existing Transcribe Public Source queue is not modified or automatically extended.
on:
  pull_request:
    paths:
      - knowledge_analysis/**
      - scripts/knowledge_model.sh
      - scripts/knowledge_source.sh
      - scripts/knowledge_analyze.py
      - tests/test_knowledge_analysis.py
      - tests/test_knowledge_phase4.py
      - scripts/knowledge_phase4.py
      - knowledge-analysis-contract.json
      - .github/workflows/knowledge-analysis.yml
  workflow_dispatch:
    inputs:
      source_kind:
        description: 'Previously generated transcription run or explicitly published same-repo release'
        required: true
        type: choice
        options: [run, release]
        default: run
      source_identifier:
        description: 'Existing Transcribe Public Source run ID OR same-repo corpus release tag'
        required: true
        type: string
      batch:
        description: '1-indexed group of 500 unique video IDs'
        required: true
        default: '1'
        type: string
      scope:
        description: 'Inventory first; review one 20-video slice or the entire 500-video group'
        required: true
        type: choice
        options: [inventory, slice, batch]
        default: inventory
      slice:
        description: '0-indexed 20-video group for scope=slice'
        required: true
        default: '0'
        type: string
      master_sha256:
        description: 'SHA-256 of authorized same-repo master routing ZIP (required for release shards)'
        required: false
        type: string
      resume_run_id:
        description: 'Optional prior Corpus Knowledge Review run containing partial results'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: knowledge-${{ github.ref }}-${{ inputs.source_kind }}-${{ inputs.source_identifier }}-${{ inputs.batch }}
  cancel-in-progress: false

jobs:
  model-canary:
    if: github.event_name == 'pull_request' && github.repository == 'Yolol100/transcriberen'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout local-model review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore verified local-model downloads (GitHub cache only)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/inference/llama.tar.gz
            ${{ runner.temp }}/inference/model/model.gguf
          key: local-qwen3-1p7b-q4-llama-b11425-sha256-v1
      - name: Verify pinned binary/model and start local inference
        run: bash scripts/knowledge_model.sh "$RUNNER_TEMP/inference"
      - name: Confirm local LLM speaks strict JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CANARY'
          from knowledge_analysis.review import LocalModel
          result = LocalModel(timeout=240).ask(
              "transcript", "For accessibility, provide labels for fields and support keyboard navigation.",
              {"title":"Canary", "video_id":"ABCDEFGHIJK", "published_date":"20261013"})
          assert isinstance(result.get("claims"), list), "local model failed schema smoke"
          print("Local model returned a JSON claims array; no external inference service used")
          PY_CANARY
      - name: E2E fixture from archive to persisted source-anchored video review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture"
          python - <<'PY_FIXTURE'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'fixture'
          text=('Accessible checkout forms need clear labels and visible validation errors. '
                'Check the keyboard-only journey and make errors repairable.')
          meta={'video_id':'ABCDEFGHIJK', 'title':'Generic accessibility fixture',
                'url':'https://www.youtube.com/watch?v=ABCDEFGHIJK',
                'transcript_status':'ok', 'transcript_sha256':hashlib.sha256(text.encode()).hexdigest(),
                'upload_date':'20261013'}
          path=root/'channel-corpus.zip'
          with zipfile.ZipFile(path,'w') as z:
            z.writestr('manifest.json',json.dumps({'items':[meta]}))
            z.writestr('videos/ABCDEFGHIJK/metadata.json',json.dumps(meta))
            z.writestr('videos/ABCDEFGHIJK/comments.json',json.dumps({'status':'ok','comments':[{'text':'Please include larger touch targets for mobile customers.'}]}))
            z.writestr('videos/ABCDEFGHIJK/transcript.txt',text)
          PY_FIXTURE
          python scripts/knowledge_analyze.py --source "$RUNNER_TEMP/fixture/channel-corpus.zip" --mode review --batch 1 --slice 0 --slice-size 20 --model-path "$RUNNER_TEMP/inference/model/model.gguf" --output-dir "$RUNNER_TEMP/e2e"
          python - <<'PY_ASSERT'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'e2e'
          inventory=json.loads((root/'inventory.json').read_text())
          result=json.loads((root/'videos/ABCDEFGHIJK.json').read_text())
          assert inventory['ai_reviewed_videos']==1, inventory
          assert result['transcript_read_completely'] and result['comments_read_completely'], result
          assert result['auto_promoted'] is False and result['human_qa_approved'] is False
          print('End-to-end archive -> local AI -> JSON progress: PASS')
          PY_ASSERT
      - name: Confirm phase-4 claims remain evidence-only and unapproved
        shell: bash
        run: |
          set -euo pipefail
          python scripts/knowledge_phase4.py --reviews-dir "$RUNNER_TEMP/e2e/videos" --out "$RUNNER_TEMP/e2e/phase4.json"
          python - <<'PY_PHASE4'
          import json, os, pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'e2e/phase4.json').read_text())
          assert report['human_qa_approved'] is False
          assert report['auto_promoted'] is False
          assert report['status']=='requires_external_project_source_readback_and_owner_qa'
          assert all(c['proposed_category']=='NEEDS_VERIFICATION' and not c['auto_promoted'] for c in report['claims'])
          print('Synthetic local Qwen review -> phase-4 no-promotion ledger: PASS')
          PY_PHASE4
  inventory:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Yolol100/transcriberen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_sources: ${{ steps.plan.outputs.expected_sources }}
    steps:
      - name: Checkout immutable requested repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read source from this GitHub repository only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_IDENTIFIER: ${{ inputs.source_identifier }}
        run: bash scripts/knowledge_source.sh "$SOURCE_KIND" "$SOURCE_IDENTIFIER" "$RUNNER_TEMP/corpus"
      - name: Validate inventory and plan slices
        id: plan
        env:
          BATCH: ${{ inputs.batch }}
          MASTER_SHA: ${{ inputs.master_sha256 }}
          SCOPE: ${{ inputs.scope }}
          SLICE: ${{ inputs.slice }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BATCH" =~ ^[1-9][0-9]{0,2}$ ]] || exit 2
          [[ "$SLICE" =~ ^(0|[1-9][0-9]?)$ ]] || exit 2
          mapfile -t src < "$RUNNER_TEMP/corpus/INPUT-FILES.txt"
          master_args=()
          if [[ "${{ inputs.source_kind }}" == release ]]; then
            test -n "$MASTER_SHA" || { echo "release master SHA is required" >&2; exit 2; }
            master_args=(--master-routing "$RUNNER_TEMP/corpus/YouTube_Kennisbron_Master.zip" --master-sha256 "$MASTER_SHA")
          fi
          python scripts/knowledge_analyze.py --source "${src[@]}" --batch "$BATCH" --slice 0 --slice-size 20 --mode inventory "${master_args[@]}" --output-dir "$RUNNER_TEMP/plan"
          python - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path
          inventory=json.loads((Path(os.environ['RUNNER_TEMP'])/'plan/inventory.json').read_text())
          scope=os.environ['SCOPE']
          pieces=math.ceil(inventory['actual_batch_count']/20)
          if scope=='batch': matrix=list(range(pieces))
          elif scope=='slice':
              val=int(os.environ['SLICE'])
              if val >= pieces: raise SystemExit('slice outside selected batch')
              matrix=[val]
          else: matrix=[0]
          sources=json.dumps(inventory['source_files'],sort_keys=True,separators=(',',':'))
          digest=hashlib.sha256(sources.encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('matrix='+json.dumps(matrix,separators=(',',':')),file=f)
              print('expected_sources='+digest,file=f)
          print('planned_slices',matrix,'source_sha',digest)
          PY
      - name: Upload inventory receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: knowledge-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/plan/inventory.json
          retention-days: 10
          if-no-files-found: error

  review:
    if: inputs.scope != 'inventory' && needs.inventory.result == 'success'
    needs: inventory
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slice: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted analysis code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read same immutable GitHub corpus source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_IDENTIFIER: ${{ inputs.source_identifier }}
        run: bash scripts/knowledge_source.sh "$SOURCE_KIND" "$SOURCE_IDENTIFIER" "$RUNNER_TEMP/corpus"
      - name: Confirm no corpus mutation since inventory stage
        env:
          EXPECTED: ${{ needs.inventory.outputs.expected_sources }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t src < "$RUNNER_TEMP/corpus/INPUT-FILES.txt"
          python - "$EXPECTED" "${src[@]}" <<'PY'
          import hashlib,json,pathlib,sys
          def digest(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()
          expected=sys.argv[1]
          paths=[pathlib.Path(x) for x in sys.argv[2:]]
          info=[{'name':p.name,'sha256':digest(p)} for p in paths]
          actual=hashlib.sha256(json.dumps(info,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if actual != expected: raise SystemExit('source mutated since inventory; fail closed')
          PY
      - name: Import only this slice's prior evidence, if requested
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.resume_run_id }}
          BATCH: ${{ inputs.batch }}
          SLICE: ${{ matrix.slice }}
          MASTER_SHA: ${{ inputs.master_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_RUN" =~ ^[1-9][0-9]{5,15}$ ]] || exit 2
          run_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" --jq '.name')"
          run_event="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" --jq '.event')"
          run_branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" --jq '.head_branch')"
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" --jq '.head_sha')"
          test "$run_name" = 'Corpus Knowledge Review' || exit 2
          test "$run_event" = 'workflow_dispatch' || exit 2
          test "$run_branch" = 'main' || exit 2
          test "$run_sha" = "$GITHUB_SHA" || { echo 'prior review used a different trusted code SHA; fail closed' >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/previous"
          gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'knowledge-review-batch-*' --dir "$RUNNER_TEMP/previous"
          mapfile -t src < "$RUNNER_TEMP/corpus/INPUT-FILES.txt"
          master_args=()
          if [[ "${{ inputs.source_kind }}" == release ]]; then
            test -n "$MASTER_SHA" || exit 2
            master_args=(--master-routing "$RUNNER_TEMP/corpus/YouTube_Kennisbron_Master.zip" --master-sha256 "$MASTER_SHA")
          fi
          python scripts/knowledge_analyze.py --source "${src[@]}" --mode inventory --batch "$BATCH" --slice "$SLICE" --slice-size 20 "${master_args[@]}" --output-dir "$RUNNER_TEMP/selected"
          python - <<'PY_RESUME'
          import json,os,pathlib,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          selected=set(json.loads((temp/'selected/inventory.json').read_text())['selected_video_ids'])
          dest=temp/'results/videos'
          dest.mkdir(parents=True,exist_ok=True)
          restored=set()
          for candidate in (temp/'previous').rglob('videos/*.json'):
            if candidate.stem not in selected:
              continue
            data=json.loads(candidate.read_text(encoding='utf-8'))
            if data.get('video_id') != candidate.stem:
              raise SystemExit('foreign or malformed prior video identity')
            target=dest/candidate.name
            if target.exists() and target.read_bytes()!=candidate.read_bytes():
              raise SystemExit('conflicting prior evidence for same video ID')
            shutil.copyfile(candidate,target)
            restored.add(candidate.stem)
          print('selected',len(selected),'restored',len(restored))
          PY_RESUME
      - name: Restore verified local-model downloads (GitHub cache only)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/inference/llama.tar.gz
            ${{ runner.temp }}/inference/model/model.gguf
          key: local-qwen3-1p7b-q4-llama-b11425-sha256-v1
      - name: Install SHA-256 verified inference engine and model
        run: bash scripts/knowledge_model.sh "$RUNNER_TEMP/inference"
      - name: Read every transcript chunk and saved comment in the selected slice
        id: analyze
        continue-on-error: true
        env:
          BATCH: ${{ inputs.batch }}
          SLICE: ${{ matrix.slice }}
          MASTER_SHA: ${{ inputs.master_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t src < "$RUNNER_TEMP/corpus/INPUT-FILES.txt"
          master_args=()
          if [[ "${{ inputs.source_kind }}" == release ]]; then
            test -n "$MASTER_SHA" || exit 2
            master_args=(--master-routing "$RUNNER_TEMP/corpus/YouTube_Kennisbron_Master.zip" --master-sha256 "$MASTER_SHA")
          fi
          python scripts/knowledge_analyze.py --source "${src[@]}" --batch "$BATCH" --slice "$SLICE" --slice-size 20 --mode review "${master_args[@]}" --model-path "$RUNNER_TEMP/inference/model/model.gguf" --time-budget-seconds 16200 --output-dir "$RUNNER_TEMP/results"
      - name: Compile reviewer-only phase-4 candidate ledger
        if: steps.analyze.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/knowledge_phase4.py --reviews-dir "$RUNNER_TEMP/results/videos" --out "$RUNNER_TEMP/results/phase4-proposals.json"
      - name: Upload compact evidence, never raw source transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: knowledge-review-batch-${{ inputs.batch }}-slice-${{ matrix.slice }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/results/
          retention-days: 10
          if-no-files-found: warn
      - name: Fail if model or review did not finish this slice
        if: steps.analyze.outcome == 'failure'
        run: exit 1
