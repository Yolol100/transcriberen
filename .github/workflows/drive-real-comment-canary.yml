name: Private v15 Real Qwen Stored-comment Canary

# Trusted main only. Uses existing authorized private Drive evidence.
# No public YouTube acquisition, writer token, or private uploads.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/drive-real-comment-canary.yml
      - scripts/verify_real_comment_canary.py
      - tests/test_real_comment_canary.py
  workflow_dispatch:

concurrency:
  group: private-v15-qwen-positive-comment-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-comment-canary:
    if: github.repository == 'Yolol100/transcriberen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fail-closed stored-comment regression tests
        run: python -m unittest discover -s tests -p 'test_real_comment_canary.py' -v
      - name: Obtain temporary private Drive read-only credential
        id: read_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: transcriberen-511520
          workload_identity_provider: projects/421736271727/locations/global/workloadIdentityPools/github-transcriberen/providers/github-actions
          service_account: github-transcriberen@transcriberen-511520.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Download and SHA-verify existing 16 private source archives
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.read_auth.outputs.access_token }}
          SOURCE_FOLDER: 14x-AIfgB67Osvt4W_VymAV7jUSqdKaPL
        run: python -m scripts.drive_corpus_fetch --folder-id "$SOURCE_FOLDER" --destination "$RUNNER_TEMP/private-v15"
      - name: Boot SHA-pinned local Qwen3 without external inference
        run: bash scripts/knowledge_model.sh "$RUNNER_TEMP/qwen"
      - name: Model the first real video with stored comments
        shell: bash
        run: |
          set -euo pipefail
          sources=("$RUNNER_TEMP"/private-v15/YouTube_Kennisbron_Master.part-*.zip)
          test "${#sources[@]}" -eq 15
          python scripts/knowledge_analyze.py \
            --source "${sources[@]}" \
            --batch 1 --slice 11 --slice-size 1 --batch-size 500 \
            --mode review --chunk-size 5600 --time-budget-seconds 2400 \
            --master-routing "$RUNNER_TEMP/private-v15/YouTube_Kennisbron_Master.zip" \
            --master-sha256 2aa93bbe7b1db1d872c9d8614240dbbdf0f0c061e0de5c6e0e753a2954763e59 \
            --model-path "$RUNNER_TEMP/qwen/model/model.gguf" \
            --output-dir "$RUNNER_TEMP/real-comment-canary"
      - name: Verify actual comment chunks against the pinned source, report counts only
        run: |
          python -m scripts.verify_real_comment_canary \
            --source-dir "$RUNNER_TEMP/private-v15" \
            --output-dir "$RUNNER_TEMP/real-comment-canary" \
            --model-path "$RUNNER_TEMP/qwen/model/model.gguf"
      - name: Discard private source, model and review files from ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/private-v15" "$RUNNER_TEMP/real-comment-canary" "$RUNNER_TEMP/qwen"

# No artifact upload, caching, PR runner, raw comment output or Drive writer.
