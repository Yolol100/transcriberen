name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review introduced dependency changes when GitHub Dependency graph is available
        id: native_dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Record native Dependency Review capability gap
        if: steps.native_dependency_review.outcome == 'failure'
        run: echo 'GitHub native Dependency Review is unavailable; captions-only tool-version verification remains enforcing.' >> "$GITHUB_STEP_SUMMARY"

  tool-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify runtime dependency surface and versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          contract = json.load(open('toolkit-contract.json', encoding='utf-8'))
          tools = {tool['id']: tool for tool in contract['tools']}
          assert set(tools) == {'yt-dlp', 'deno-ejs-runtime'}
          bootstrap = pathlib.Path('scripts/install_tools.sh').read_text(encoding='utf-8')
          expected = {
              'YT_DLP_VERSION': tools['yt-dlp']['version'],
              'DENO_VERSION': tools['deno-ejs-runtime']['version'],
          }
          for name, value in expected.items():
              assert f'{name}="{value}"' in bootstrap, (name, value)
          for removed in ('requirements.in', 'requirements.txt', 'requirements.lock'):
              assert not pathlib.Path(removed).exists(), removed
          print('dependency-surface: OK')
          PY

  publish-main-status:
    needs: tool-pins
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout status publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish exact main Dependency Audit status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_status.py --context 'post-merge/Dependency Audit' --result '${{ needs.tool-pins.result }}'
