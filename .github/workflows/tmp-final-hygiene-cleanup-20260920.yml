name: Temporary final hygiene cleanup 2026-09-20
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete exact merged obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCHES: |
            fix/doctor-fix-rounds-temp|3149a596d31c6f067c2b695e0299a676f5412149
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch for $branch: expected=$expected actual=$actual" >&2
              exit 3
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted: $branch"
          done <<< "$EXPECTED_BRANCHES"
