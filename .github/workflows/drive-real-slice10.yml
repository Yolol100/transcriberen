name: Private v15 Real Qwen Ten-video Slice

# Trusted main-only OIDC; no private data in public pull-request runners.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/drive-real-slice10.yml
      - scripts/drive_slice10_result.py
      - tests/test_live_slice10.py
  workflow_dispatch:

concurrency:
  group: private-v15-qwen-first-ten-slice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  first-ten-real-videos:
    if: github.repository == 'Yolol100/transcriberen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test ten-video review safety contracts
        run: python -m unittest discover -s tests -p 'test_live_slice10.py' -v
      - name: OIDC private read-only Drive credential
        id: read_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: transcriberen-511520
          workload_identity_provider: projects/421736271727/locations/global/workloadIdentityPools/github-transcriberen/providers/github-actions
          service_account: github-transcriberen@transcriberen-511520.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Download and fully verify immutable v15 private source ZIPs
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.read_auth.outputs.access_token }}
          SOURCE_FOLDER: 14x-AIfgB67Osvt4W_VymAV7jUSqdKaPL
        run: python -m scripts.drive_corpus_fetch --folder-id "$SOURCE_FOLDER" --destination "$RUNNER_TEMP/private-v15"
      - name: Boot SHA-pinned local Qwen3 without external inference
        run: bash scripts/knowledge_model.sh "$RUNNER_TEMP/qwen"
      - name: Review the first ten real videos and all saved chunks
        shell: bash
        run: |
          set -euo pipefail
          sources=("$RUNNER_TEMP"/private-v15/YouTube_Kennisbron_Master.part-*.zip)
          test "${#sources[@]}" -eq 15
          python scripts/knowledge_analyze.py \
            --source "${sources[@]}" --batch 1 --slice 0 --slice-size 10 --batch-size 500 \
            --mode review --chunk-size 5600 --time-budget-seconds 16200 \
            --master-routing "$RUNNER_TEMP/private-v15/YouTube_Kennisbron_Master.zip" \
            --master-sha256 2aa93bbe7b1db1d872c9d8614240dbbdf0f0c061e0de5c6e0e753a2954763e59 \
            --model-path "$RUNNER_TEMP/qwen/model/model.gguf" \
            --output-dir "$RUNNER_TEMP/real-ten-video-review"
          python scripts/knowledge_phase4.py \
            --reviews-dir "$RUNNER_TEMP/real-ten-video-review/videos" \
            --out "$RUNNER_TEMP/real-ten-video-review/ledger.json"
      - name: Refresh OIDC writer credential after model review
        id: write_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: transcriberen-511520
          workload_identity_provider: projects/421736271727/locations/global/workloadIdentityPools/github-transcriberen/providers/github-actions
          service_account: github-transcriberen@transcriberen-511520.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify all ten against original chunks and write private Drive result
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.write_auth.outputs.access_token }}
          RESULTS_FOLDER: 19JA5uzyohsB23WhErZ4g5xZIaFsLkjXa
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python -m scripts.drive_slice10_result \
            --source-dir "$RUNNER_TEMP/private-v15" \
            --output-dir "$RUNNER_TEMP/real-ten-video-review" \
            --model-path "$RUNNER_TEMP/qwen/model/model.gguf" \
            --results-folder-id "$RESULTS_FOLDER" --run-id "$GH_RUN_ID"

# Absolutely no upload-artifact or private runner cache.
