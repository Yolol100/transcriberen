name: Transcribe Public Source

on:
  push:
    branches: [runtime-requests]
    paths:
      - 'requests/queue/*.json'
  workflow_call:
    inputs:
      request_json:
        description: 'Volledig gecontroleerd request JSON volgens het Transcriberen-contract'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      url:
        description: 'Publieke HTTP(S)-bron; leeg toegestaan bij YouTube search'
        required: false
        type: string
      mode:
        description: 'auto, media, article, feed, sitemap of youtube'
        required: true
        default: youtube
        type: choice
        options: [auto, media, article, feed, sitemap, youtube]
      language:
        description: 'Taalcode of auto'
        required: true
        default: auto
        type: string
      youtube_scope:
        description: 'video, short, search, playlist, channel_videos, channel_shorts, channel_streams of channel_all'
        required: true
        default: video
        type: choice
        options: [video, short, search, playlist, channel_videos, channel_shorts, channel_streams, channel_all]
      youtube_query:
        description: 'Zoekterm voor youtube_scope=search'
        required: false
        type: string
      youtube_sort_by:
        description: 'Rangschik/selecteer binnen opgehaalde kandidaatset'
        required: true
        default: relevance
        type: choice
        options: [relevance, views, likes, comments, newest, random]
      youtube_max_items:
        required: true
        default: '20'
        type: string
      youtube_candidate_limit:
        required: true
        default: '100'
        type: string
      youtube_scan_limit:
        required: true
        default: '500'
        type: string
      youtube_allow_unbounded:
        description: 'Expliciete opt-in voor grotere workloads'
        required: true
        default: false
        type: boolean
      youtube_year_from:
        required: false
        type: string
      youtube_year_to:
        required: false
        type: string
      youtube_min_views:
        required: false
        type: string
      youtube_min_likes:
        required: false
        type: string
      youtube_min_comments:
        required: false
        type: string
      youtube_include_comments:
        required: true
        default: false
        type: boolean
      youtube_comment_sort:
        required: true
        default: top
        type: choice
        options: [top, new]
      youtube_max_comments:
        required: true
        default: '200'
        type: string
      youtube_include_replies:
        description: 'Replies expliciet meenemen; standaard alleen top-level comments'
        required: true
        default: false
        type: boolean
      youtube_comment_selection:
        description: 'platform = alleen ophalen; knowledge = explainable review-kandidaten maken'
        required: true
        default: platform
        type: choice
        options: [platform, knowledge]
      youtube_comment_review_limit:
        required: true
        default: '50'
        type: string
      knowledge_goal:
        description: 'Doel van kennisreview; verplicht bij comment_selection=knowledge'
        required: false
        type: string
      knowledge_target_owner:
        description: 'Canonieke eigenaar voor kandidaat-review'
        required: true
        default: webactueel-workflow
        type: choice
        options: [webactueel-workflow, leads, seo, design, elementor, wordpressqualityarchitect, website-qa-checklist]
      knowledge_keywords:
        description: 'Optionele komma-gescheiden reviewtermen'
        required: false
        type: string
      youtube_access_basis:
        description: 'Vooraf beoordeelde basis: prior-written-permission of applicable-law-reviewed'
        required: true
        default: unverified
        type: choice
        options: [unverified, prior-written-permission, applicable-law-reviewed]
      public_request_acknowledged:
        description: 'Bevestig dat requestvelden in een publieke repository publiek kunnen worden'
        required: true
        default: false
        type: boolean
      allow_audio_fallback:
        required: true
        default: false
        type: boolean
      audio_access_authorized:
        required: true
        default: false
        type: boolean
      analysis_content_allowed:
        description: 'Alleen voor private/local runtime; publieke repo weigert raw transcript/comment persistence'
        required: true
        default: false
        type: boolean
      reuse_allowed:
        required: true
        default: false
        type: boolean
      rights_basis:
        required: true
        default: analysis-paraphrase-only
        type: string
      source_set_version:
        description: 'Moet exact gelijk zijn aan toolkit-contract.json'
        required: true
        default: '2.0.0-audit-hardening'
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      install_whisper: ${{ steps.resolve.outputs.install_whisper }}
      persist_content: ${{ steps.resolve.outputs.persist_content }}
    steps:
      - name: Read immutable queue request
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          path: transport

      - name: Validate queue transport
        if: github.event_name == 'push'
        id: queue
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path('transport')
          before, after = os.environ['BEFORE'], os.environ['AFTER']
          changed = subprocess.check_output(
              ['git', '-C', str(root), 'diff', '--name-status', before, after], text=True
          ).splitlines()
          accepted = []
          for line in changed:
              parts = line.split('\t')
              if len(parts) == 2 and parts[0] == 'A' and re.fullmatch(r'requests/queue/[A-Za-z0-9][A-Za-z0-9._-]{2,79}\.json', parts[1]):
                  accepted.append(parts[1])
              elif line.strip():
                  raise SystemExit(f'queue push may add exactly one request JSON and nothing else: {line}')
          if len(accepted) != 1:
              raise SystemExit(f'expected exactly one new queue request, got {len(accepted)}')
          source = root / accepted[0]
          request = json.loads(source.read_text(encoding='utf-8'))
          request_id = str(request.get('request_id') or '')
          if source.stem != request_id:
              raise SystemExit('queue filename must equal request_id')
          if request.get('enabled') is not True:
              raise SystemExit('queue request must set enabled=true')
          target = pathlib.Path(os.environ['RUNNER_TEMP_DIR']) / 'incoming-request.json'
          target.write_text(json.dumps(request, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'queue request: {request_id}')
          PY

      - name: Materialize workflow_call request
        if: github.event_name == 'workflow_call'
        shell: bash
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
          TARGET: ${{ runner.temp }}/incoming-request.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          request = json.loads(os.environ['REQUEST_JSON'])
          if request.get('enabled') is not True:
              raise SystemExit('workflow_call request must set enabled=true')
          pathlib.Path(os.environ['TARGET']).write_text(
              json.dumps(request, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Checkout trusted runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/transcriberen
          ref: main
          persist-credentials: false
          path: runtime

      - name: Resolve and validate request
        id: resolve
        working-directory: runtime
        env:
          REQUEST_FILE: ${{ runner.temp }}/incoming-request.json
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_YOUTUBE_SCOPE: ${{ inputs.youtube_scope }}
          INPUT_YOUTUBE_QUERY: ${{ inputs.youtube_query }}
          INPUT_YOUTUBE_SORT_BY: ${{ inputs.youtube_sort_by }}
          INPUT_YOUTUBE_MAX_ITEMS: ${{ inputs.youtube_max_items }}
          INPUT_YOUTUBE_CANDIDATE_LIMIT: ${{ inputs.youtube_candidate_limit }}
          INPUT_YOUTUBE_SCAN_LIMIT: ${{ inputs.youtube_scan_limit }}
          INPUT_YOUTUBE_ALLOW_UNBOUNDED: ${{ inputs.youtube_allow_unbounded }}
          INPUT_YOUTUBE_YEAR_FROM: ${{ inputs.youtube_year_from }}
          INPUT_YOUTUBE_YEAR_TO: ${{ inputs.youtube_year_to }}
          INPUT_YOUTUBE_MIN_VIEWS: ${{ inputs.youtube_min_views }}
          INPUT_YOUTUBE_MIN_LIKES: ${{ inputs.youtube_min_likes }}
          INPUT_YOUTUBE_MIN_COMMENTS: ${{ inputs.youtube_min_comments }}
          INPUT_YOUTUBE_INCLUDE_COMMENTS: ${{ inputs.youtube_include_comments }}
          INPUT_YOUTUBE_COMMENT_SORT: ${{ inputs.youtube_comment_sort }}
          INPUT_YOUTUBE_MAX_COMMENTS: ${{ inputs.youtube_max_comments }}
          INPUT_YOUTUBE_INCLUDE_REPLIES: ${{ inputs.youtube_include_replies }}
          INPUT_YOUTUBE_COMMENT_SELECTION: ${{ inputs.youtube_comment_selection }}
          INPUT_YOUTUBE_COMMENT_REVIEW_LIMIT: ${{ inputs.youtube_comment_review_limit }}
          INPUT_KNOWLEDGE_GOAL: ${{ inputs.knowledge_goal }}
          INPUT_KNOWLEDGE_TARGET_OWNER: ${{ inputs.knowledge_target_owner }}
          INPUT_KNOWLEDGE_KEYWORDS: ${{ inputs.knowledge_keywords }}
          INPUT_YOUTUBE_ACCESS_BASIS: ${{ inputs.youtube_access_basis }}
          INPUT_PUBLIC_REQUEST_ACKNOWLEDGED: ${{ inputs.public_request_acknowledged }}
          INPUT_ALLOW_AUDIO_FALLBACK: ${{ inputs.allow_audio_fallback }}
          INPUT_AUDIO_ACCESS_AUTHORIZED: ${{ inputs.audio_access_authorized }}
          INPUT_ANALYSIS_CONTENT_ALLOWED: ${{ inputs.analysis_content_allowed }}
          INPUT_REUSE_ALLOWED: ${{ inputs.reuse_allowed }}
          INPUT_RIGHTS_BASIS: ${{ inputs.rights_basis }}
          INPUT_SOURCE_SET_VERSION: ${{ inputs.source_set_version }}
        run: python3 scripts/resolve_request_hardened.py

      - name: Upload resolved request for runtime job
        if: steps.resolve.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-transcription-request
          path: runtime/resolved-request.json
          retention-days: 1
          if-no-files-found: error

  runtime:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 330
    concurrency:
      group: transcribe-${{ needs.resolve.outputs.request_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/transcriberen
          ref: main
          persist-credentials: false

      - name: Record runtime SHA
        id: runtime_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download resolved request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-transcription-request

      - name: Install verified Python extraction dependencies
        run: bash scripts/install_python_deps.sh

      - name: Install FFmpeg only for authorized Whisper fallback
        if: needs.resolve.outputs.install_whisper == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout 300s sudo apt-get "${APT_OPTS[@]}" update
          timeout 300s sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Install pinned local tools
        run: bash scripts/install_tools.sh '${{ needs.resolve.outputs.install_whisper }}'

      - name: Execute public-source runtime
        env:
          REQUEST_FILE: resolved-request.json
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          GITHUB_SHA: ${{ steps.runtime_sha.outputs.sha }}
        run: python scripts/runtime.py

      - name: Normalize extended YouTube result for current validator
        if: always()
        run: |
          if [ -f results/youtube-index.json ]; then
            python scripts/normalize_youtube_result_v2.py results/youtube-index.json
          fi

      - name: Validate result contract, privacy and provenance
        id: result_validation
        run: python scripts/validate_result.py results/result.json

      - name: Build deterministic result checksum receipt
        shell: bash
        run: |
          set -euo pipefail
          find results -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > results/SHA256SUMS.txt
          test -s results/SHA256SUMS.txt

      - name: Attest result checksum receipt
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: results/SHA256SUMS.txt

      - name: Publish provenance summary
        if: always()
        shell: bash
        run: |
          echo '## Transcriberen controlled-runtime' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Request: ${{ needs.resolve.outputs.request_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Content persistence: ${{ needs.resolve.outputs.persist_content }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime SHA: ${{ steps.runtime_sha.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/result.json ]; then
            python -c 'import json; r=json.load(open("results/result.json", encoding="utf-8")); p=r.get("runtime_provenance") or {}; print("Mode: {}\nEvidence: {}\nUsage: {}\nSource set: {}\nHead SHA: {}\nRun ID: {}\nContent persisted: {}".format(r.get("detected_mode"), r.get("evidence_level"), r.get("usage_mode"), (r.get("source_context") or {}).get("source_set_version"), p.get("head_sha"), p.get("run_id"), r.get("content_persisted")))' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validated result
        if: steps.result_validation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcription-result-${{ needs.resolve.outputs.request_id }}
          path: results/
          retention-days: 3
          if-no-files-found: warn
