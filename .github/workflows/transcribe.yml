name: Transcribe Public Source

on:
  push:
    branches: [main]
    paths:
      - 'requests/transcribe.json'
  workflow_dispatch:
    inputs:
      url:
        description: 'Publieke HTTP(S)-bron'
        required: true
        type: string
      mode:
        description: 'auto, media, article, feed of sitemap'
        required: true
        default: auto
        type: choice
        options: [auto, media, article, feed, sitemap]
      language:
        description: 'Taalcode of auto'
        required: true
        default: nl
        type: string
      max_items:
        description: '0 = volledig YouTube-kanaal/playlist tot veiligheidslimiet; anders maximaal 1-5000 videos'
        required: true
        default: '0'
        type: string
      allow_audio_fallback:
        description: 'Gebruik lokale whisper.cpp alleen voor expliciet geautoriseerde niet-YouTube-audio'
        required: true
        default: false
        type: boolean
      audio_access_authorized:
        description: 'Bevestig dat de audio rechtmatig is aangeleverd/toegankelijk en transcriptie is geautoriseerd'
        required: true
        default: false
        type: boolean
      reuse_allowed:
        description: 'Persist genormaliseerde inhoud alleen als hergebruik aantoonbaar is toegestaan'
        required: true
        default: false
        type: boolean
      rights_basis:
        description: 'Concrete rechtenbasis vereist voor audiofallback of reuse_allowed=true'
        required: true
        default: analysis-only
        type: string
      source_set_version:
        description: 'Actuele Project Transcriberen source_set_version'
        required: true
        default: manual-dispatch
        type: string

permissions:
  contents: read

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      install_whisper: ${{ steps.resolve.outputs.install_whisper }}
      reuse_allowed: ${{ steps.resolve.outputs.reuse_allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate request
        id: resolve
        env:
          REQUEST_FILE: requests/transcribe.json
          INPUT_URL: ${{ inputs.url }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items }}
          INPUT_ALLOW_AUDIO_FALLBACK: ${{ inputs.allow_audio_fallback }}
          INPUT_AUDIO_ACCESS_AUTHORIZED: ${{ inputs.audio_access_authorized }}
          INPUT_REUSE_ALLOWED: ${{ inputs.reuse_allowed }}
          INPUT_RIGHTS_BASIS: ${{ inputs.rights_basis }}
          INPUT_SOURCE_SET_VERSION: ${{ inputs.source_set_version }}
        run: python3 scripts/resolve_request.py

      - name: Upload resolved request for runtime job
        if: steps.resolve.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-transcription-request
          path: resolved-request.json
          retention-days: 1
          if-no-files-found: error

  runtime:
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download resolved request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-transcription-request

      - name: Install verified Python extraction dependency
        run: bash scripts/install_python_deps.sh

      - name: Install FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout 300s sudo apt-get "${APT_OPTS[@]}" update
          timeout 300s sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Install pinned local media/transcription tools
        run: bash scripts/install_tools.sh '${{ needs.resolve.outputs.install_whisper }}'

      - name: Execute public-source runtime
        env:
          REQUEST_FILE: resolved-request.json
        run: python scripts/entrypoint.py

      - name: Validate result contract, provenance and rights gate
        env:
          REQUEST_FILE: resolved-request.json
        run: python scripts/validate_result.py results/result.json

      - name: Publish provenance summary
        if: always()
        shell: bash
        run: |
          echo '## Transcriberen controlled-runtime' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Request: ${{ needs.resolve.outputs.request_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Content persistence requested: ${{ needs.resolve.outputs.reuse_allowed }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/result.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('results/result.json', encoding='utf-8'))
          p = r.get('provenance', {})
          print('Detected mode: {}'.format(r.get('detected_mode')))
          print('Evidence level: {}'.format(r.get('evidence_level')))
          print('Content persisted: {}'.format(r.get('content_persisted')))
          print('Content SHA-256: {}'.format(r.get('content_sha256')))
          print('Request SHA-256: {}'.format(p.get('request_sha256')))
          print('Repository commit: {}'.format(p.get('repository_commit')))
          PY
          fi

      - name: Upload normalized result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcription-result-${{ needs.resolve.outputs.request_id }}
          path: results/
          retention-days: 7
          if-no-files-found: warn
