name: Transcribe Public Source

on:
  push:
    branches: [runtime-requests]
    paths:
      - 'requests/queue/*.json'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      request_id: ${{ steps.resolve.outputs.request_id }}
    steps:
      - name: Read immutable queue request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          path: transport

      - name: Validate queue transport
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path('transport')
          changed = subprocess.check_output(
              ['git', '-C', str(root), 'diff', '--name-status', os.environ['BEFORE'], os.environ['AFTER']],
              text=True,
          ).splitlines()
          accepted = []
          for line in changed:
              parts = line.split('\t')
              if len(parts) == 2 and parts[0] == 'A' and re.fullmatch(
                  r'requests/queue/[A-Za-z0-9][A-Za-z0-9._-]{2,79}\.json', parts[1]
              ):
                  accepted.append(parts[1])
              elif line.strip():
                  raise SystemExit(f'queue may add exactly one request JSON and nothing else: {line}')
          if len(accepted) != 1:
              raise SystemExit(f'expected exactly one new queue request, got {len(accepted)}')
          source = root / accepted[0]
          request = json.loads(source.read_text(encoding='utf-8'))
          request_id = str(request.get('request_id') or '')
          if source.stem != request_id:
              raise SystemExit('queue filename must equal request_id')
          if request.get('enabled') is not True:
              raise SystemExit('queue request must set enabled=true')
          target = pathlib.Path(os.environ['RUNNER_TEMP_DIR']) / 'incoming-request.json'
          target.write_text(json.dumps(request, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Checkout trusted runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/transcriberen
          ref: main
          persist-credentials: false
          path: runtime

      - name: Resolve request
        id: resolve
        working-directory: runtime
        env:
          REQUEST_FILE: ${{ runner.temp }}/incoming-request.json
        run: python3 scripts/resolve_request.py

      - name: Upload resolved request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-transcription-request
          path: runtime/resolved-request.json
          retention-days: 1
          if-no-files-found: error

      - name: Publish pending self-hosted runtime status
        if: steps.resolve.outputs.run == 'true'
        working-directory: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_ci_status.py --context 'runtime/Transcribe Public Source' --result pending

  runtime:
    needs: resolve
    if: needs.resolve.outputs.run == 'true' && github.repository == 'Yolol100/transcriberen'
    runs-on: [self-hosted, linux, x64, webactueel-transcribe]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      statuses: write
    concurrency:
      group: transcribe-${{ needs.resolve.outputs.request_id }}
      cancel-in-progress: false
    steps:
      - name: Verify dedicated runner boundary
        shell: bash
        env:
          ACTUAL_ENVIRONMENT: ${{ runner.environment }}
          ACTUAL_OS: ${{ runner.os }}
          ACTUAL_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$ACTUAL_ENVIRONMENT" = 'self-hosted'
          test "$ACTUAL_OS" = 'Linux'
          test "$ACTUAL_ARCH" = 'X64'

      - name: Checkout trusted runtime only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yolol100/transcriberen
          ref: main
          persist-credentials: false
          clean: true

      - name: Record runtime SHA
        id: runtime_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download resolved request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-transcription-request

      - name: Provision exact caption tools
        run: bash scripts/install_tools.sh

      - name: Check persistent caption cache
        id: cache
        env:
          REQUEST_FILE: resolved-request.json
          GITHUB_SHA: ${{ steps.runtime_sha.outputs.sha }}
          TRANSCRIBE_EXECUTION_TARGET: self-hosted
        run: python3 scripts/cache_runtime.py precheck

      - name: Extract one public caption track
        if: steps.cache.outputs.hit != 'true'
        env:
          REQUEST_FILE: resolved-request.json
          GITHUB_SHA: ${{ steps.runtime_sha.outputs.sha }}
          TRANSCRIBE_EXECUTION_TARGET: self-hosted
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true
          python3 scripts/captions_runtime.py

      - name: Update persistent history and export processed index
        env:
          REQUEST_FILE: resolved-request.json
          GITHUB_SHA: ${{ steps.runtime_sha.outputs.sha }}
          TRANSCRIBE_EXECUTION_TARGET: self-hosted
        run: python3 scripts/cache_runtime.py finalize

      - name: Validate minimal result contract
        id: result_validation
        run: python3 scripts/validate_result.py results/result.json

      - name: Build deterministic checksum receipt
        shell: bash
        run: |
          set -euo pipefail
          (
            cd results
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' \
              > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Attest result checksum receipt
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: results/SHA256SUMS.txt

      - name: Upload validated result
        if: steps.result_validation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcription-result-${{ needs.resolve.outputs.request_id }}
          path: results/
          retention-days: 3
          if-no-files-found: error

      - name: Fail only on acquisition errors
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open('results/result.json', encoding='utf-8'))
          status = result['status']
          print(f'status={status}')
          print(f"cache_hit={bool(result.get('cache_hit'))}")
          if status in {'access_blocked', 'error'}:
              raise SystemExit(result.get('error') or status)
          PY

      - name: Publish queue-run status and run URL
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_ci_status.py --context 'runtime/Transcribe Public Source' --result '${{ job.status }}'
