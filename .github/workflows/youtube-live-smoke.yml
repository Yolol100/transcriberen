name: YouTube Access Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accountless-youtube-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Install accountless YouTube toolchain
        run: bash scripts/install_tools.sh false
      - name: Diagnose public YouTube access without credentials
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import entrypoint
          import runtime

          videos = entrypoint.discover_youtube_videos('https://www.youtube.com/@OpenAI', 3)
          print(f'discovered={len(videos)}')
          blocked = 0
          for video in videos:
              req = {
                  'url': video['url'],
                  'language': 'en',
                  'allow_audio_fallback': False,
                  'audio_access_authorized': False,
              }
              meta = {
                  'title': video['title'],
                  'extractor': 'Youtube',
                  'webpage_url': video['url'],
                  'id': video['id'],
              }
              try:
                  text, source_type, _, _ = runtime.media_content(req, meta)
              except runtime.YoutubeAccessBlocked as exc:
                  blocked += 1
                  print(f"access_blocked={video['id']} detail={exc}")
                  continue
              except Exception as exc:
                  print(f"no_captions={video['id']} detail={exc}")
                  continue
              print(f"caption_ok={video['id']} source={source_type} chars={len(text)}")
          if blocked:
              print(f'YouTube anti-bot access blocked {blocked}/{len(videos)} sampled videos on this runner.')
          PY
