name: Temporary YouTube Live Smoke

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/youtube-live-smoke.yml'

permissions:
  contents: read

jobs:
  live-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Install accountless YouTube toolchain
        run: bash scripts/install_tools.sh false
      - name: Test direct public timedtext fallback
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen
          sys.path.insert(0, str(Path('scripts').resolve()))
          import entrypoint

          videos = entrypoint.discover_youtube_videos('https://www.youtube.com/@OpenAI', 5)
          print(f'discovered={len(videos)}')
          for video in videos:
              for host in ('www.youtube.com', 'video.google.com'):
                  url = f'https://{host}/api/timedtext?type=list&v={video["id"]}' if host == 'www.youtube.com' else f'https://{host}/timedtext?type=list&v={video["id"]}'
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=15) as response:
                          body = response.read(100000).decode('utf-8', errors='replace')
                  except Exception as exc:
                      print(f'{video["id"]} {host} error={exc}', file=sys.stderr)
                      continue
                  print(f'{video["id"]} {host} bytes={len(body)} body={body[:2000]}')
                  if '<track' in body:
                      raise SystemExit(0)
          raise SystemExit('No public timedtext track inventory was available from the GitHub-hosted runner')
          PY
