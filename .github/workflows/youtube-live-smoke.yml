name: Temporary YouTube Live Smoke

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/youtube-live-smoke.yml'

permissions:
  contents: read

jobs:
  live-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Install accountless YouTube toolchain
        run: bash scripts/install_tools.sh false
      - name: Diagnose public YouTube captions without credentials
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import entrypoint
          import runtime

          videos = entrypoint.discover_youtube_videos('https://www.youtube.com/@OpenAI', 5)
          print(f'discovered={len(videos)}')
          usable = False
          for video in videos:
              command = runtime.yt_base() + ['--list-subs', video['url']]
              result = runtime.run(command, check=False)
              print(f"=== {video['id']} list-subs rc={result.returncode} ===")
              print(result.stdout[-12000:])
              print(result.stderr[-12000:], file=sys.stderr)
              if result.returncode == 0 and ('Available subtitles' in result.stdout or 'Available automatic captions' in result.stdout):
                  usable = True
                  req = {'url': video['url'], 'language': 'en', 'allow_audio_fallback': False, 'audio_access_authorized': False}
                  meta = {'title': video['title'], 'extractor': 'Youtube', 'webpage_url': video['url'], 'id': video['id']}
                  try:
                      text, source_type, _, _ = runtime.media_content(req, meta)
                  except Exception as exc:
                      print(f"caption-fetch-failed {video['id']}: {exc}", file=sys.stderr)
                  else:
                      print(f"caption_ok={video['id']} source={source_type} chars={len(text)}")
                      raise SystemExit(0)
          if not usable:
              raise SystemExit('No subtitle inventory was exposed by yt-dlp for the sampled public channel videos')
          raise SystemExit('Subtitle inventory exists, but the current caption download path failed')
          PY
