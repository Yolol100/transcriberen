name: YouTube Live Smoke

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/youtube-live-smoke.yml'

permissions:
  contents: read

jobs:
  live-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Install accountless YouTube toolchain
        run: bash scripts/install_tools.sh false

      - name: Install local PO-token provider candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/yt-dlp/plugins"
          curl -fsSL --retry 3 \
            'https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/download/1.3.1/bgutil-ytdlp-pot-provider.zip' \
            -o "$HOME/.config/yt-dlp/plugins/bgutil-ytdlp-pot-provider.zip"
          echo 'b8ceec7f76143da172aaf5ebeec0c2d218e5680c063b931586bca48567069b38  '"$HOME/.config/yt-dlp/plugins/bgutil-ytdlp-pot-provider.zip" | sha256sum -c -
          git clone --quiet --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$HOME/bgutil-ytdlp-pot-provider"
          test "$(git -C "$HOME/bgutil-ytdlp-pot-provider" rev-parse HEAD)" = '7608dd51ee813b48cf9a6d68c6e42cb197ce10e0'
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          "$GITHUB_WORKSPACE/tools/bin/deno" install --allow-scripts=npm:canvas --frozen

      - name: Verify public channel discovery and captions without credentials
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import entrypoint
          import runtime

          channel = 'https://www.youtube.com/@OpenAI'
          targets = entrypoint.collection_targets(channel)
          assert targets == [
              'https://www.youtube.com/@OpenAI/videos',
              'https://www.youtube.com/@OpenAI/shorts',
              'https://www.youtube.com/@OpenAI/streams',
          ]
          videos = entrypoint.discover_youtube_videos(channel, 10)
          print(f'targets={len(targets)} discovered={len(videos)}')
          failures = []

          for video in videos:
              req = {
                  'url': video['url'],
                  'language': 'en',
                  'allow_audio_fallback': False,
                  'audio_access_authorized': False,
              }
              meta = {
                  'title': video['title'],
                  'extractor': 'Youtube',
                  'webpage_url': video['url'],
                  'id': video['id'],
              }
              try:
                  text, source_type, _, _ = runtime.media_content(req, meta)
              except Exception as exc:
                  failures.append(f"{video['id']}: {exc}")
                  if len(failures) == 1:
                      with tempfile.TemporaryDirectory(prefix='yt-dlp-caption-diag-') as tmpdir:
                          diag = runtime.run(runtime.yt_base() + [
                              '--verbose', '--write-subs', '--write-auto-subs',
                              '--sub-langs', 'en,en.*', '--sub-format', 'srt/vtt/best',
                              '--skip-download', '-o', str(Path(tmpdir) / 'source.%(ext)s'),
                              video['url'],
                          ], check=False)
                          print('--- first caption diagnostic stdout ---', file=sys.stderr)
                          print(diag.stdout[-4000:], file=sys.stderr)
                          print('--- first caption diagnostic stderr ---', file=sys.stderr)
                          print(diag.stderr[-8000:], file=sys.stderr)
                  continue
              assert text.strip(), 'caption text is empty'
              assert source_type == 'subtitle'
              print(f"caption_ok={video['id']} chars={len(text)}")
              raise SystemExit(0)

          print('\n'.join(failures[-10:]), file=sys.stderr)
          raise SystemExit('No usable public caption track found in the first 10 discovered channel videos')
          PY
