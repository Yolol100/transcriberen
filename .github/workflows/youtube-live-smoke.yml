name: YouTube Availability Probe

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publiek YouTube-kanaal om vanaf deze runner te testen'
        required: true
        default: 'https://www.youtube.com/@OpenAI'
        type: string

permissions:
  contents: read

jobs:
  probe-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Install accountless YouTube toolchain
        run: bash scripts/install_tools.sh false

      - name: Probe public channel discovery and captions without credentials
        env:
          PROBE_CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import entrypoint
          import runtime

          channel = os.environ['PROBE_CHANNEL']
          videos = entrypoint.discover_youtube_videos(channel, 10)
          if not videos:
              raise SystemExit('No public videos discovered')

          caption_ok = None
          failures = []
          for video in videos:
              req = {
                  'url': video['url'],
                  'language': 'auto',
                  'allow_audio_fallback': False,
                  'audio_access_authorized': False,
              }
              meta = {
                  'title': video['title'],
                  'extractor': 'Youtube',
                  'webpage_url': video['url'],
                  'id': video['id'],
              }
              try:
                  text, source_type, _, _ = runtime.media_content(req, meta)
              except Exception as exc:
                  failures.append(f"{video['id']}: {exc}")
                  continue
              if text.strip() and source_type == 'subtitle':
                  caption_ok = (video, len(text))
                  break

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('## YouTube availability probe\n\n')
              handle.write(f'- Channel: `{channel}`\n')
              handle.write(f'- Public videos discovered: `{len(videos)}`\n')
              handle.write('- Credentials/cookies/proxy/API key: `none`\n')
              if caption_ok:
                  handle.write('- Public captions reachable from this runner: `yes`\n')
                  handle.write(f"- Verified video: `{caption_ok[0]['id']}` ({caption_ok[1]} chars)\n")
              else:
                  handle.write('- Public captions reachable from this runner: `no`\n')
                  handle.write('- Meaning: YouTube blocked or exposed no usable captions from this hosted runner. The repo does not bypass that with login, cookies, proxy, audio download or an external transcript service.\n')

          print(f'discovered={len(videos)}')
          if caption_ok:
              print(f"caption_ok={caption_ok[0]['id']} chars={caption_ok[1]}")
          else:
              print('caption_available=false')
              for failure in failures[-3:]:
                  print(failure, file=sys.stderr)
          PY
