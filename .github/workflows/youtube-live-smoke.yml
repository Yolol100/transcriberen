name: Temporary YouTube Live Smoke

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/youtube-live-smoke.yml'

permissions:
  contents: read

jobs:
  live-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Install accountless YouTube toolchain
        run: bash scripts/install_tools.sh false
      - name: Test accountless YouTube player clients for subtitles
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import entrypoint
          import runtime

          videos = entrypoint.discover_youtube_videos('https://www.youtube.com/@OpenAI', 3)
          print(f'discovered={len(videos)}')
          clients = ['web_safari', 'web_embedded', 'tv', 'android_vr']
          for video in videos:
              for client in clients:
                  command = runtime.yt_base() + [
                      '--extractor-args', f'youtube:player_client={client}',
                      '--list-subs', video['url']
                  ]
                  result = runtime.run(command, check=False)
                  print(f"=== {video['id']} client={client} rc={result.returncode} ===")
                  print(result.stdout[-8000:])
                  print(result.stderr[-8000:], file=sys.stderr)
                  has_inventory = result.returncode == 0 and ('Available subtitles' in result.stdout or 'Available automatic captions' in result.stdout)
                  if not has_inventory:
                      continue
                  with __import__('tempfile').TemporaryDirectory(prefix='live-caption-') as tmpdir:
                      out = str(Path(tmpdir) / 'source.%(ext)s')
                      fetch = runtime.run(runtime.yt_base() + [
                          '--extractor-args', f'youtube:player_client={client}',
                          '--write-subs', '--write-auto-subs', '--sub-langs', 'en,en.*',
                          '--sub-format', 'srt/vtt/best', '--skip-download', '-o', out, video['url']
                      ], check=False)
                      print(fetch.stdout[-8000:])
                      print(fetch.stderr[-8000:], file=sys.stderr)
                      files = list(Path(tmpdir).glob('source*.srt')) + list(Path(tmpdir).glob('source*.vtt'))
                      if files:
                          text = runtime.normalize_subtitles(files[0])
                          if text:
                              print(f"caption_ok={video['id']} client={client} chars={len(text)}")
                              raise SystemExit(0)
          raise SystemExit('No tested accountless player client could retrieve public captions from this GitHub-hosted runner')
          PY
