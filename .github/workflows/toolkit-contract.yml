name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'THREAT-MODEL.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/REPOSITORY-GOVERNANCE.md'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: toolkit-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate code and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/install_tools.sh scripts/run_local.sh
          python -m unittest discover -s tests -v
          python scripts/doctor.py --mode ci --json

      - name: Validate captions-only toolkit contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          contract = json.load(open('toolkit-contract.json', encoding='utf-8'))
          assert contract['schema_version'] == '2.0'
          assert contract['source_set_version'] == '2.2.0-captions-only'
          assert contract['owner_skill'] == 'webactueel-workflow'
          assert contract['project_id'] == 'project-transcriberen'
          assert contract['runtime_target'] == 'self-hosted-or-local-direct-network'
          for key in ('requires_account', 'requires_api_key', 'requires_mcp'):
              assert contract.get(key) is False

          tools = {tool['id']: tool for tool in contract['tools']}
          assert set(tools) == {'yt-dlp', 'deno-ejs-runtime'}
          assert tools['yt-dlp']['version'] == '2026.08.20.234504'
          assert tools['deno-ejs-runtime']['version'] == '2.9.5'

          forbidden = {
              'requirements.in', 'requirements.txt', 'requirements.lock',
              'scripts/runtime.py', 'scripts/runtime_topic_filter.py',
              'scripts/youtube_runtime.py', 'scripts/innertube_runtime.py',
              'scripts/caption_client_profiles.py', 'scripts/normalize_youtube_result_v2.py',
              'scripts/resolve_request_hardened.py', 'scripts/install_python_deps.sh',
              '.github/workflows/transcribe-self-hosted.yml', '.github/workflows/lock-audit.yml',
          }
          for path in forbidden:
              assert not pathlib.Path(path).exists(), path

          resolver = pathlib.Path('scripts/resolve_request.py').read_text(encoding='utf-8')
          assert 'ALLOWED_INPUT_KEYS = {"enabled", "request_id", "url", "language"}' in resolver
          assert 'source_type = "short"' in resolver

          runtime = pathlib.Path('scripts/captions_runtime.py').read_text(encoding='utf-8')
          for needle in ('"--skip-download"', '"--no-cookies"', 'skipped_no_captions', 'transcript.txt'):
              assert needle in runtime
          for forbidden_term in ('include_comments', 'knowledge_context', 'whisper', 'ffmpeg', 'trafilatura'):
              assert forbidden_term not in runtime.casefold()

          workflow = pathlib.Path('.github/workflows/transcribe.yml').read_text(encoding='utf-8')
          assert 'branches: [runtime-requests]' in workflow
          assert 'runs-on: [self-hosted, linux, x64, webactueel-transcribe]' in workflow
          assert 'python3 scripts/captions_runtime.py' in workflow
          assert 'ref: main' in workflow
          assert 'workflow_dispatch:' not in workflow
          assert 'workflow_call:' not in workflow
          for forbidden_term in ('runtime_topic_filter.py', 'normalize_youtube_result', 'ffmpeg', 'whisper'):
              assert forbidden_term not in workflow.casefold()

          print('toolkit-contract: OK')
          PY

      - name: Create deterministic CI provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nsha=%s\nworkflow=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKFLOW" > ci-provenance.txt

      - name: Attest CI provenance receipt
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ci-provenance.txt

  publish-main-status:
    needs: validate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout status publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish exact main Toolkit Contract status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_status.py --context 'post-merge/Toolkit Contract' --result '${{ needs.validate.result }}'
