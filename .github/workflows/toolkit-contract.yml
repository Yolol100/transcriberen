name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'THREAT-MODEL.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/REPOSITORY-GOVERNANCE.md'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: toolkit-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate code and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/install_tools.sh scripts/run_local.sh
          python -m unittest discover -s tests -v
          python scripts/doctor.py --mode ci --json

      - name: Validate channel-only capability contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          contract = json.load(open('toolkit-contract.json', encoding='utf-8'))
          assert contract['schema_version'] == '3.0'
          assert contract['capability_id'] == 'public-youtube-channel-caption-corpus'
          assert contract['repository'] == 'Yolol100/transcriberen'
          assert contract['runtime_target'] == 'github-hosted-first-self-hosted-fallback-or-local-direct-network'
          assert contract['inputs'] == ['youtube-channel-url', 'optional-language']
          assert contract['fixed_policy'] == {
              'year': 2026,
              'max_videos': 1000,
              'comments_per_video': 7,
              'comment_sort': 'top',
              'include_replies': False,
              'video_concurrency': 7,
          }
          for key in ('owner_skill', 'owner_mode', 'project_id', 'source_set_version'):
              assert key not in contract, f'project/skill truth leaked into capability contract: {key}'
          for key in ('requires_account', 'requires_api_key', 'requires_mcp'):
              assert contract.get(key) is False

          tools = {tool['id']: tool for tool in contract['tools']}
          assert set(tools) == {'yt-dlp', 'deno-ejs-runtime'}
          assert tools['yt-dlp']['version'] == '2026.09.16.232951'
          assert tools['yt-dlp']['sha256'] == 'f8ca14db511702a5dbfc5a527056312907ddd0914d0b4036f108d6849e17ef61'
          assert tools['deno-ejs-runtime']['version'] == '2.9.7'
          assert tools['deno-ejs-runtime']['sha256'] == 'c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490'

          resolver = pathlib.Path('scripts/resolve_request.py').read_text(encoding='utf-8')
          assert '"source_type": "channel"' in resolver
          assert 'MAX_VIDEOS = 1000' in resolver
          assert 'COMMENTS_PER_VIDEO = 7' in resolver

          engine = pathlib.Path('scripts/captions_runtime.py').read_text(encoding='utf-8')
          for needle in ('"--skip-download"', '"--no-cookies"', 'comment_sort=top', 'max_comments={limit},{limit},0,0,1'):
              assert needle in engine
          assert 'if __name__ == "__main__"' not in engine
          assert '"--no-warnings"' not in engine

          channel = pathlib.Path('scripts/channel_runtime.py').read_text(encoding='utf-8')
          for needle in ('"--playlist-end"', 'str(max_videos)', 'upload_date.startswith("2026")', 'load_top_comments', '"metadata_failures"', '"partial_reasons"', '"unresolved"', 'channel-corpus.zip', 'VIDEO_CONCURRENCY = 7', 'max_workers=VIDEO_CONCURRENCY', 'range(0, len(video_ids), VIDEO_CONCURRENCY)', 'access_blocked_event'):
              assert needle in channel

          hybrid = pathlib.Path('scripts/classify_hybrid_result.py').read_text(encoding='utf-8')
          for needle in ('status == "access_blocked"', 'item.get("status") == "access_blocked"', 'item.get("transcript_status") == "access_blocked"', 'item.get("comments_status") == "access_blocked"'):
              assert needle in hybrid

          cache = pathlib.Path('scripts/cache_runtime.py').read_text(encoding='utf-8')
          assert '"scope": "current_run"' in cache
          assert 'entries: list[tuple[str, str]]' in cache

          validator = pathlib.Path('scripts/validate_result.py').read_text(encoding='utf-8')
          assert 'processed-index must contain exactly the current run video ids' in validator
          assert 'incomplete corpus may not report status ok' in validator
          assert '"github-hosted"' in validator

          workflow = pathlib.Path('.github/workflows/transcribe.yml').read_text(encoding='utf-8')
          assert 'branches: [runtime-requests]' in workflow
          assert 'runs-on: ubuntu-24.04' in workflow
          assert 'runs-on: [self-hosted, linux, x64, webactueel-transcribe]' in workflow
          assert 'python3 scripts/channel_runtime.py' in workflow
          assert 'python3 scripts/classify_hybrid_result.py' in workflow
          assert 'python3 scripts/captions_runtime.py' not in workflow
          assert 'Verify dedicated runner boundary' in workflow
          assert 'Attest result checksum receipt' in workflow
          assert 'TRANSCRIBE_EXECUTION_TARGET: github-hosted' in workflow
          assert 'TRANSCRIBE_EXECUTION_TARGET: self-hosted' in workflow
          assert "needs.hosted_attempt.outputs.fallback_required == 'true'" in workflow
          assert "needs.hosted_attempt.result == 'success'" in workflow
          assert 'runtime_sha: ${{ steps.runtime_sha.outputs.sha }}' in workflow
          assert 'ref: ${{ needs.resolve.outputs.runtime_sha }}' in workflow
          assert 'test "$actual" = "$EXPECTED_RUNTIME_SHA"' in workflow
          assert 'workflow_dispatch:' not in workflow
          assert 'workflow_call:' not in workflow

          print('toolkit-contract: OK')
          PY

      - name: Verify pinned tool bootstrap and Deno wiring
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_tools.sh
          test "$(tools/bin/yt-dlp --version)" = '2026.09.16.232951'
          test "$(tools/bin/deno --version | head -n 1 | awk '{print $2}')" = '2.9.7'

      - name: Create deterministic CI provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nsha=%s\nworkflow=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKFLOW" > ci-provenance.txt

      - name: Attest CI provenance receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-provenance.txt

  publish-main-status:
    needs: validate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout status publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish exact main Toolkit Contract status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_status.py --context 'post-merge/Toolkit Contract' --result '${{ needs.validate.result }}'
