name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'requirements.in'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'tests/**'
      - 'SECURITY.md'
      - 'THREAT-MODEL.md'
      - 'README.md'
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: toolkit-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install verified Python extraction dependencies
        run: bash scripts/install_python_deps.sh

      - name: Validate code and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/install_tools.sh scripts/install_python_deps.sh
          python -m unittest discover -s tests -v

      - name: Validate toolkit and audit-hardening boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re

          contract = json.load(open('toolkit-contract.json', encoding='utf-8'))
          assert contract['schema_version'] == '1.2'
          assert contract['source_set_version'] == '2.1.0-public-analysis'
          assert contract['owner_skill'] == 'webactueel-workflow'
          assert contract['project_id'] == 'project-transcriberen'
          for key in ('requires_account', 'requires_api_key', 'requires_mcp'):
              assert contract.get(key) is False

          ids = [tool['id'] for tool in contract['tools']]
          assert len(ids) == len(set(ids))
          covered = set()
          for assertion in contract['usage_assertions']:
              assert assertion['tool'] in ids
              path = pathlib.Path(assertion['path'])
              assert path.is_file(), path
              assert assertion['contains'] in path.read_text(encoding='utf-8'), assertion
              covered.add(assertion['tool'])
          assert covered == set(ids)

          requirements_txt = pathlib.Path('requirements.txt').read_text(encoding='utf-8').strip()
          assert requirements_txt == '-r requirements.lock'
          lock = pathlib.Path('requirements.lock').read_text(encoding='utf-8')
          assert 'trafilatura==2.1.0' in lock
          lock_lines = [x.strip() for x in lock.splitlines() if x.strip() and not x.startswith('#')]
          pattern = re.compile(r'^[a-z0-9][a-z0-9._-]*==[^ ]+ --hash=sha256:[0-9a-f]{64}  # [^ ]+\.whl$')
          assert lock_lines and all(pattern.fullmatch(x) for x in lock_lines)

          resolver = pathlib.Path('scripts/resolve_request.py').read_text(encoding='utf-8')
          for needle in (
              'current_source_set_version', 'youtube_access_basis', 'public_request_acknowledged',
              'MAX_BOUNDED_COMMENT_BUDGET', 'comment_selection', 'channel_streams'
          ):
              assert needle in resolver

          hardened_resolver = pathlib.Path('scripts/resolve_request_hardened.py').read_text(encoding='utf-8')
          assert 'INPUT_YOUTUBE_INCLUDE_REPLIES' in hardened_resolver
          assert 'base.validate_request(req)' in hardened_resolver

          youtube = pathlib.Path('scripts/youtube_runtime.py').read_text(encoding='utf-8')
          for needle in (
              '"--skip-download"', 'skip=translated_subs', 'rank_comment_candidates',
              'transcript-cues.json', 'comment-review.json', 'channel_streams', '"--sleep-requests"',
              'raise_incomplete_data=1', 'retry-queue.json', 'knowledge-handoff.json'
          ):
              assert needle in youtube
          assert 'bestaudio' not in youtube and '"-x"' not in youtube
          assert 'SUBTITLE_CLIENT_FALLBACKS' in youtube
          assert 'max_comments={_comment_limit_args' in youtube

          runtime = pathlib.Path('scripts/runtime.py').read_text(encoding='utf-8')
          for needle in (
              'DEFAULT_COMMAND_TIMEOUT_SECONDS', 'MAX_AUTHORIZED_AUDIO_DURATION_SECONDS',
              'robots_policy', 'Retry-After', 'pinned_public_dns', 'runtime_provenance',
              'XML DTD/entity declarations are forbidden'
          ):
              assert needle in runtime

          tool_bootstrap = pathlib.Path('scripts/install_tools.sh').read_text(encoding='utf-8')
          assert 'yt-dlp/yt-dlp-nightly-builds/releases/latest' in tool_bootstrap
          assert 'SHA2-256SUMS' in tool_bootstrap
          assert 'YT_DLP_SHA256' in tool_bootstrap

          workflow = pathlib.Path('.github/workflows/transcribe.yml').read_text(encoding='utf-8')
          for needle in (
              'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1',
              'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97',
              'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c',
              'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d',
              'GITHUB_REPOSITORY_VISIBILITY', 'public_request_acknowledged', 'youtube_access_basis',
              'Install FFmpeg only for authorized Whisper fallback'
          ):
              assert needle in workflow
          assert 'artifact-metadata: write' in workflow
          assert 'workflow_dispatch:' in workflow and 'workflow_call:' in workflow
          assert 'branches: [runtime-requests]' in workflow
          assert "requests/queue/*.json" in workflow
          assert 'ref: main' in workflow
          assert 'resolve_request_hardened.py' in workflow
          assert "if: steps.result_validation.outcome == 'success'" in workflow
          assert 'attestations: write' in workflow and 'id-token: write' in workflow

          dep = pathlib.Path('.github/workflows/dependency-review.yml').read_text(encoding='utf-8')
          assert 'actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294' in dep
          assert 'pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266' in dep
          assert 'require-hashes: true' in dep and 'no-deps: true' in dep

          codeql = pathlib.Path('.github/workflows/codeql.yml').read_text(encoding='utf-8')
          assert codeql.count('@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd') == 2
          assert 'language: [python, actions]' in codeql
          assert 'validate_codeql_sarif.py' in codeql

          for policy in ('SECURITY.md', 'THREAT-MODEL.md'):
              assert pathlib.Path(policy).is_file()
          print('toolkit-contract: OK')
          PY

      - name: Create deterministic CI provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nsha=%s\nworkflow=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKFLOW" > ci-provenance.txt

      - name: Attest CI provenance receipt
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ci-provenance.txt

      - name: Verify yt-dlp nightly binary and Deno route
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_tools.sh false
          YT_DLP_VERSION="$(tools/bin/yt-dlp --version)"
          [[ "$YT_DLP_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{6}$ ]]
          tools/bin/deno --version | grep -F 'deno 2.9.5'
          cat tools/yt-dlp-resolution.txt

      - name: Upload resolved nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yt-dlp-nightly-resolution
          path: tools/yt-dlp-resolution.txt
          retention-days: 1
          if-no-files-found: error

      - name: Verify Trafilatura runtime
        run: python -c "import trafilatura; assert trafilatura.__version__ == '2.1.0'; print(trafilatura.__version__)"

  publish-main-status:
    needs: validate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout status publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish exact main Toolkit Contract status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_status.py --context 'post-merge/Toolkit Contract' --result '${{ needs.validate.result }}'
