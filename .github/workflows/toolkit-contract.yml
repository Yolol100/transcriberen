name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'THREAT-MODEL.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/REPOSITORY-GOVERNANCE.md'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: toolkit-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate code and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/install_tools.sh scripts/run_local.sh
          python -m unittest discover -s tests -v
          python scripts/doctor.py --mode ci --json

      - name: Validate channel-only capability contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          contract = json.load(open('toolkit-contract.json', encoding='utf-8'))
          assert contract['schema_version'] == '3.0'
          assert contract['capability_id'] == 'public-youtube-channel-caption-corpus'
          assert contract['repository'] == 'Yolol100/transcriberen'
          assert contract['runtime_target'] == 'self-hosted-or-local-direct-network'
          assert contract['inputs'] == ['youtube-channel-url', 'optional-language']
          assert contract['fixed_policy'] == {
              'year': 2026,
              'max_videos': 1000,
              'comments_per_video': 7,
              'comment_sort': 'top',
              'include_replies': False,
          }
          for key in ('owner_skill', 'owner_mode', 'project_id', 'source_set_version'):
              assert key not in contract, f'project/skill truth leaked into capability contract: {key}'
          for key in ('requires_account', 'requires_api_key', 'requires_mcp'):
              assert contract.get(key) is False

          tools = {tool['id']: tool for tool in contract['tools']}
          assert set(tools) == {'yt-dlp', 'deno-ejs-runtime'}
          assert tools['yt-dlp']['version'] == '2026.08.20.234504'
          assert tools['yt-dlp']['sha256'] == '8962aa45f945ae5aa11ab49acab365e8baef569ec995149f99ae0ae3a19cae93'
          assert tools['deno-ejs-runtime']['version'] == '2.9.5'
          assert tools['deno-ejs-runtime']['sha256'] == '8b010a3b1a4a0188a67cdb8a7a27348b2a501af78aec7fc74f2ace167368d530'

          resolver = pathlib.Path('scripts/resolve_request.py').read_text(encoding='utf-8')
          assert '"source_type": "channel"' in resolver
          assert 'MAX_VIDEOS = 1000' in resolver
          assert 'COMMENTS_PER_VIDEO = 7' in resolver

          engine = pathlib.Path('scripts/captions_runtime.py').read_text(encoding='utf-8')
          for needle in ('"--skip-download"', '"--no-cookies"', 'comment_sort=top', 'max_comments={limit},{limit},0,0,0'):
              assert needle in engine
          assert 'if __name__ == "__main__"' not in engine
          assert '"--no-warnings"' not in engine

          channel = pathlib.Path('scripts/channel_runtime.py').read_text(encoding='utf-8')
          for needle in ('"--playlist-end", str(max_videos)', 'upload_date.startswith("2026")', 'load_top_comments', 'channel-corpus.zip'):
              assert needle in channel

          workflow = pathlib.Path('.github/workflows/transcribe.yml').read_text(encoding='utf-8')
          assert 'branches: [runtime-requests]' in workflow
          assert 'runs-on: [self-hosted, linux, x64, webactueel-transcribe]' in workflow
          assert 'python3 scripts/channel_runtime.py' in workflow
          assert 'python3 scripts/captions_runtime.py' not in workflow
          assert 'Verify dedicated runner boundary' in workflow
          assert 'Attest result checksum receipt' in workflow
          assert 'workflow_dispatch:' not in workflow
          assert 'workflow_call:' not in workflow

          print('toolkit-contract: OK')
          PY

      - name: Verify pinned tool bootstrap and Deno wiring
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_tools.sh
          test "$(tools/bin/yt-dlp --version)" = '2026.08.20.234504'
          test "$(tools/bin/deno --version | head -n 1 | awk '{print $2}')" = '2.9.5'

      - name: Create deterministic CI provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nsha=%s\nworkflow=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKFLOW" > ci-provenance.txt

      - name: Attest CI provenance receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-provenance.txt

  publish-main-status:
    needs: validate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout status publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish exact main Toolkit Contract status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_status.py --context 'post-merge/Toolkit Contract' --result '${{ needs.validate.result }}'
