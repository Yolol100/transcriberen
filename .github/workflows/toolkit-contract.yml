name: Toolkit Contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'toolkit-contract.json'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: toolkit-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install fully locked Python extraction dependencies
        run: bash scripts/install_python_deps.sh

      - name: Install validation runtimes
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout 300s sudo apt-get "${APT_OPTS[@]}" update
          timeout 300s sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends ffmpeg shellcheck

      - name: Validate code and request safety regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py tests/*.py
          bash -n scripts/install_tools.sh scripts/install_python_deps.sh
          shellcheck scripts/install_tools.sh scripts/install_python_deps.sh
          python -m unittest discover -s tests -v

      - name: Validate registered toolkit, lock and accountless boundaries
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          contract = json.load(open('toolkit-contract.json', encoding='utf-8'))
          assert contract['owner_skill'] == 'webactueel-workflow'
          assert contract['owner_mode'] == 'transcribeer'
          assert contract['project_id'] == 'project-transcriberen'
          for key in ('requires_account', 'requires_api_key', 'requires_mcp'):
              assert contract.get(key) is False, f'{key} must be false'
          ids = [tool['id'] for tool in contract['tools']]
          assert len(ids) == len(set(ids)), 'duplicate tool ids'
          assert 'deno-ejs-runtime' in ids
          assert 'node-ejs-runtime' not in ids
          covered = set()
          for assertion in contract['usage_assertions']:
              assert assertion['tool'] in ids, assertion['tool']
              path = pathlib.Path(assertion['path'])
              assert path.is_file(), f'missing {path}'
              assert assertion['contains'] in path.read_text(encoding='utf-8'), f"{assertion['tool']} not wired in {path}"
              covered.add(assertion['tool'])
          assert covered == set(ids), f'unwired tools: {set(ids) - covered}'

          direct = [line.strip() for line in pathlib.Path('requirements.txt').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]
          assert direct == ['trafilatura==2.1.0'], direct
          lock_lines = [line.strip() for line in pathlib.Path('requirements.lock').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]
          assert len(lock_lines) == 17, len(lock_lines)
          pattern = re.compile(r'^[a-z0-9-]+==[^ ]+ --hash=sha256:[0-9a-f]{64}  # .+\.whl$')
          assert all(pattern.fullmatch(line) for line in lock_lines), 'invalid lock line'
          assert any(line.startswith('trafilatura==2.1.0 --hash=sha256:0eded5207a806445ddebbe36eae30b9035fe6a2f233c36f6fe82663fca8b9d30') for line in lock_lines)

          workflow = pathlib.Path('.github/workflows/transcribe.yml').read_text(encoding='utf-8')
          assert 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' in workflow
          assert 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' in workflow
          assert 'persist-credentials: false' in workflow
          assert 'actions/setup-node' not in workflow

          dependency_audit = pathlib.Path('.github/workflows/dependency-review.yml').read_text(encoding='utf-8')
          assert 'pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266' in dependency_audit
          assert 'inputs: requirements.lock' in dependency_audit

          codeql = pathlib.Path('.github/workflows/codeql.yml').read_text(encoding='utf-8')
          assert 'github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81' in codeql
          assert 'github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81' in codeql
          assert 'validate_codeql_sarif.py' in codeql

          installer = pathlib.Path('scripts/install_tools.sh').read_text(encoding='utf-8')
          assert 'DENO_VERSION="v2.9.5"' in installer
          assert 'DENO_SHA256="8b010a3b1a4a0188a67cdb8a7a27348b2a501af78aec7fc74f2ace167368d530"' in installer
          assert '--js-runtimes "deno:$HERE/deno"' in installer
          assert '--remote-components' not in installer
          assert "--noproxy '*'" in installer

          python_deps = pathlib.Path('scripts/install_python_deps.sh').read_text(encoding='utf-8')
          assert '--require-hashes' in python_deps
          assert '--only-binary=:all:' in python_deps
          assert '--isolated install' in python_deps
          assert 'requirements.lock' in python_deps
          assert 'pip download' not in python_deps

          runtime = pathlib.Path('scripts/runtime.py').read_text(encoding='utf-8')
          entrypoint = pathlib.Path('scripts/entrypoint.py').read_text(encoding='utf-8')
          validator = pathlib.Path('scripts/validate_result.py').read_text(encoding='utf-8')
          assert '--no-netrc' not in runtime
          assert '--no-netrc' not in entrypoint
          assert 'ProxyHandler({})' in runtime
          assert 'runtime_provenance' in runtime
          assert 'not_attempted_source_access_blocked' in entrypoint
          assert 'persisted content sha256 mismatch' in validator
          assert '"/videos", stripped + "/shorts", stripped + "/streams"' in entrypoint
          assert 'source-register.json' in entrypoint
          assert 'knowledge-handoff.json' in entrypoint
          print('toolkit-contract: OK')
          PY

      - name: Verify pinned media toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_tools.sh false
          test "$(tools/bin/yt-dlp --version)" = '2026.07.04'
          tools/bin/deno --version > /tmp/deno-version.txt
          grep -F 'deno 2.9.5' /tmp/deno-version.txt
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Verify Trafilatura runtime
        run: python -c "import trafilatura; assert trafilatura.__version__ == '2.1.0'; print(trafilatura.__version__)"
