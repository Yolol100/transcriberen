name: Cleanup obsolete runtime branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-runtime-selfhosted.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete obsolete self-hosted transport branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: runtime-requests-selfhosted
        run: |
          set -euo pipefail
          ref="heads/$TARGET_BRANCH"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
            echo "Branch still exists" >&2
            exit 1
          fi
          echo "Deleted $TARGET_BRANCH"
